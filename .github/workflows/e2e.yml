name: E2E

# The browser tests of the example app run only after a merge into main, not on
# pull requests: they are slower, and they check the published build.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium and its system libraries
        run: npm exec --workspace=@tinker/example-basics -- playwright install --with-deps chromium

      - name: Run the example's browser tests
        run: npm run test:e2e --workspace=@tinker/example-basics
