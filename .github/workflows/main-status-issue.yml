name: Main status issue

# Keeps one issue open while main is failing its checks. A failed run of Checks or
# E2E on main opens the issue, or adds a comment to it; a passing run closes it.
on:
  workflow_run:
    workflows: [Checks, E2E]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: main-status-issue
  cancel-in-progress: false

jobs:
  failed:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Open the issue, or comment on it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW: ${{ github.event.workflow_run.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name + ": " + .html_url')
          body=$(printf '%s\n' \
            "The **$WORKFLOW** workflow failed on \`main\`." \
            "" \
            "- Commit: $SHA" \
            "- Run: $RUN_URL" \
            "" \
            "Failing jobs:" \
            "${jobs:-"- (none listed; see the run)"}" \
            "" \
            "This issue is updated by each failed run on main, and closed by the next passing one.")
          gh label create ci-failure --repo "$REPO" --color B60205 \
            --description "Checks failing on main" --force
          number=$(gh issue list --repo "$REPO" --label ci-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label ci-failure \
              --title "CI is failing on main" --body "$body"
          fi

  passed:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Close the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          number=$(gh issue list --repo "$REPO" --label ci-failure --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$REPO" \
              --body "Main is passing again: $RUN_URL"
            gh issue close "$number" --repo "$REPO"
          fi
