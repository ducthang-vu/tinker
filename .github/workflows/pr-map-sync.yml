name: PR map sync

# On a pull request, merges main into its branch. When the only conflicts are in generated
# files (the repo maps, *.repo-map.md, and the API reference), they are regenerated and
# pushed. Any other conflict is left for the author, with a comment on the pull request.
# Runs only for branches in this repository: a fork's branch cannot be pushed to.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

# One sync per pull request at a time.
concurrency:
  group: pr-map-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # The full history: a merge needs the common ancestor of main and the branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Merge main into the branch
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge --no-edit origin/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conflicts=$(git diff --name-only --diff-filter=U)
          others=$(printf '%s\n' "$conflicts" | grep -vE '(\.repo-map\.md|^examples/basics/src/features/apidoc/api-reference\.json)$' || true)
          if [ -n "$others" ]; then
            git merge --abort
            body=$(printf '%s\n' \
              "Merging \`main\` into this branch conflicts in files other than the repo maps, so the branch was not changed:" \
              "" \
              "$(printf -- '- `%s`\n' $others)" \
              "" \
              "Merge \`main\` by hand to resolve them." \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")
            gh pr comment "$PR" --body "$body"
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "clean=map-only" >> "$GITHUB_OUTPUT"

      - name: Regenerate the repo maps
        if: steps.merge.outputs.clean != 'false'
        run: |
          npm run repo-map -- --format markdown
          npm run docs:api

      - name: Check the result, then commit and push
        if: steps.merge.outputs.clean != 'false'
        run: |
          set -euo pipefail
          # A push with the default token does not start the Checks workflow again,
          # so the checks run here, before the push.
          npm run lint
          npm run typecheck
          npm test

          git add -A
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit
          elif ! git diff --cached --quiet; then
            git commit -m "Regenerate the repo maps"
          else
            echo "Nothing to push."
            exit 0
          fi
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
