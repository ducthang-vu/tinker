<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tinker counter</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { signal, computed, h, mount } from "../../src/index.js";

      function Counter() {
        const count = signal(0);
        const parity = computed(() => (count() % 2 === 0 ? "even" : "odd"));

        return h("div", null,
          h("h1", null, "Count: ", count),
          h("p", { class: parity }, "The count is ", parity),
          h("button", { onClick: () => count.set((n) => n - 1) }, "-"),
          h("button", { onClick: () => count.set((n) => n + 1) }, "+"),
        );
      }

      mount(Counter, document.getElementById("app"));
    </script>
  </body>
</html>
